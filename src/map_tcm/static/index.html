<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAP-TCM Alpha｜医生工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">MAP Clinical Apprentice Alpha</p>
        <h1>中医临床记录工作台</h1>
      </div>
      <div class="safety-badge">仅限合成数据 · 医生最终决定</div>
    </header>

    <main>
      <section class="notice" aria-label="安全边界">
        <strong>安全边界</strong>
        <span>这是工程验证环境，不得录入真实患者资料。AI 内容始终是草稿，不能独立诊断或处方。</span>
      </section>

      <section class="metrics" id="metrics" aria-label="项目概览"></section>

      <div class="workspace-grid">
        <section class="panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Workflow</p>
              <h2>就诊草稿</h2>
            </div>
            <button id="refresh" class="secondary">刷新</button>
          </div>
          <div id="encounters" class="encounter-list"></div>
        </section>

        <section class="panel">
          <p class="eyebrow">Synthetic demo</p>
          <h2>推进审核流程</h2>
          <p class="muted">选择一条草稿记录，用合成文字演示“观察 → 医生判断 → 审核 → 签署”。</p>

          <label for="encounter-select">就诊记录</label>
          <select id="encounter-select"></select>

          <label for="synthetic-note">合成观察</label>
          <textarea id="synthetic-note" rows="3">合成示例：昨夜入睡时间较前一日提前，晨起精神稍有改善。</textarea>

          <div class="button-stack">
            <button id="add-observation">1. 添加患者观察</button>
            <button id="add-assessment">2. 添加医生判断</button>
            <button id="review-encounter">3. 医生审核</button>
            <button id="sign-encounter" class="primary">4. 医生签署</button>
          </div>
          <div id="message" class="message" role="status" aria-live="polite"></div>
        </section>
      </div>

      <section class="panel audit-panel">
        <p class="eyebrow">Traceability</p>
        <h2>最近审计事件</h2>
        <div id="audit" class="audit-list"></div>
      </section>
    </main>

    <footer>MAP-TCM Alpha · 本地优先 · 追加式审计 · 合成数据模式</footer>
    <script src="/app.js"></script>
  </body>
</html>
