[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "map-tcm-alpha"
version = "0.1.0"
description = "Doctor-led MAP-TCM clinical record and follow-up Alpha skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agents = ["openai-agents>=0.8,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
map_tcm = ["static/*"]
